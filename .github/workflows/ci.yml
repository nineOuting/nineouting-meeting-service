name: CI

on:
  pull_request:
    branches: [dev, stage, main]
  push:
    branches: [dev, stage]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # 테스트는 Testcontainers로 PostgreSQL·LocalStack(SNS·SQS)를 띄운다 (GitHub 러너에 Docker가 있다).
      - name: Build
        run: ./gradlew build --no-daemon --console=plain
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}

  # dev에 머지되면 이미지를 GitHub 컨테이너 저장소(ghcr.io)에 올린다.
  # 팀원은 nineouting-infra의 integration/으로 이 이미지를 받아 전체 서비스를 띄운다.
  image:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/nineouting/${{ github.event.repository.name }}:dev
            ghcr.io/nineouting/${{ github.event.repository.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # 공통 모듈(GitHub Packages)을 받는 토큰. BuildKit secret이라 이미지에 남지 않는다
          secrets: |
            gpr_actor=${{ github.actor }}
            gpr_token=${{ secrets.GPR_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
