# meeting-service 로컬 개발용 의존 서비스.
#   docker compose up -d   → 이후 ./gradlew bootRun --args='--spring.profiles.active=local'
# user-service(토큰 공개키, 사용자 이름)·workspace-service(폴더 권한)도 함께 띄워야 한다. 여러 서비스를 함께 띄우는 것은 nineouting-docs/integration에서 한다.
# 주의: LocalStack이 4566을 쓰므로 다른 서비스의 compose와 동시에 띄우면 겹친다. 하나만 띄워 함께 쓴다 (토픽·큐 전체를 만든다).
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: meeting_db
      POSTGRES_USER: ${DB_USERNAME:-meeting_service}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-meeting_service}
    ports:
      - "5436:5432"   # user(5433)·workspace(5434)·notification(5435)와 겹치지 않게
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "meeting_service", "-d", "meeting_db"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine     # 회의방 메시지를 인스턴스끼리 나눠 보내는 Pub/Sub, localhost:6379
    ports:
      - "6379:6379"

  localstack:
    # 로컬용 AWS SNS·SQS (이벤트). 토픽·큐·구독은 init-sns-sqs.sh가 만든다 (운영은 Terraform)
    image: localstack/localstack:4.4
    environment:
      SERVICES: sns,sqs
      AWS_DEFAULT_REGION: ap-northeast-2
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack/init-sns-sqs.sh:/etc/localstack/init/ready.d/init-sns-sqs.sh:ro

volumes:
  postgres-data:
