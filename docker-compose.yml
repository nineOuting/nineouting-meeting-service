# meeting-service 로컬 개발용 의존 서비스.
#   docker compose up -d   → 이후 ./gradlew bootRun --args='--spring.profiles.active=local'
# user-service(토큰 공개키, 사용자 이름)·workspace-service(폴더 권한)도 함께 띄워야 한다. 여러 서비스를 함께 띄우는 것은 nineouting-docs/integration에서 한다.
# 주의: Kafka가 9092를 쓰므로 user-service의 compose와 동시에 띄우면 Kafka가 겹친다. 하나만 띄워 함께 쓴다.
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: meeting_db
      POSTGRES_USER: ${DB_USERNAME:-meeting_service}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-meeting_service}
    ports:
      - "5436:5432"   # user(5433)·workspace(5434)·notification(5435)와 겹치지 않게
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "meeting_service", "-d", "meeting_db"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1   # KRaft 단일 브로커, localhost:9092
    ports:
      - "9092:9092"

volumes:
  postgres-data:
